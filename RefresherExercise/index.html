<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #4589ce;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.15);
            padding: 32px;
            box-sizing: border-box;
        }

        .login-card h1 {
            margin: 0 0 20px;
            font-size: 28px;
            color: #1f2d4b;
        }

        .login-card p {
            margin: 0 0 28px;
            color: #677294;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4d5f7f;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9e1ef;
            border-radius: 10px;
            background: #f7f9ff;
            font-size: 15px;
            color: #1f2d4b;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4b6cb7;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-card button:hover {
            background: #3a539b;
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #8a96b3;
        }

        .login-footer a {
            color: #4b6cb7;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>LOGIN</h1>
        <p>Sign in to access your account credentials.</p>
        <!-- CHANGED action -->
        <form action="login.php" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>

</body>

</html>
